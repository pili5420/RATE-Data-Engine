name: RATE Exact-MAIN Material Promotion Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/rebaseline_material/rate-rebaseline-20261002-1930-cc-approved-v1/**"
      - "tests/test_exact_main_material_promotion.py"
      - ".github/workflows/rate_exact_main_material_promotion_ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Read-only material bindings and bootstrap regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RATE_MATERIAL_PROMOTION_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser for contract tests
        run: python -m pip install PyYAML==6.0.3
      - name: Validate workflow syntax without executing bootstrap
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          -shellcheck= -pyflakes=
          .github/workflows/rate_production_rebaseline_bootstrap.yml
          .github/workflows/rate_exact_main_material_promotion_ci.yml
      - name: Run binding checks and isolated bootstrap regressions
        run: >-
          python -B -m unittest
          tests.test_rate_rebaseline_bootstrap
          tests.test_rate_eod_rebaseline_material
          tests.test_rate_soak_005
          tests.test_production_scheduler_change_control
          tests.test_state_engine
          tests.test_production_integration
          tests.test_exact_main_material_promotion -v
      - name: Confirm verification did not mutate tracked production materials
        run: git diff --exit-code
