name: RATE Route B Acceptance Bridge CI

on:
  pull_request:
    branches: [main]
    paths:
      - src/route_b_acceptance_bridge.py
      - tests/test_route_b_acceptance_bridge.py
      - .github/workflows/rate_route_b_acceptance_bridge_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bridge and session tests
        run: python -B -m unittest tests.test_route_b_acceptance_bridge tests.test_route_b_post_merge_activation tests.test_production_acceptance_session -v
      - name: No tracked mutation
        run: git diff --exit-code
