name: RATE History Acceptance Sidecar Synthetic Engineering
on:
  pull_request:
    branches: [main]
    paths:
      - src/history_acceptance_sidecar.py
      - scripts/run_history_acceptance_sidecar.py
      - scripts/verify_history_acceptance_sidecar.py
      - tests/test_history_acceptance_sidecar.py
      - docs/contracts/RATE_HISTORY_ACCEPTANCE_SIDECAR_V1.json
      - docs/RATE_HISTORY_ACCEPTANCE_SIDECAR_V1.md
      - .github/workflows/rate_history_acceptance_sidecar_ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rate-history-sidecar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Protected baseline, all inherited tests and sidecar tests
        run: >-
          python -B scripts/verify_history_acceptance_sidecar.py
          --expected-base fbdfbfcf0a003cd6de49911bc0a784275a32031c
          --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "${{ runner.temp }}/history-acceptance-sidecar"
      - name: Current-main replacement and full continuity
        run: >-
          python -B scripts/verify_ci_applicability.py
          --expected-base fbdfbfcf0a003cd6de49911bc0a784275a32031c
          --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "${{ runner.temp }}/sidecar-replacement"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SIDECAR_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/history-acceptance-sidecar
            ${{ runner.temp }}/sidecar-replacement
          if-no-files-found: error
          retention-days: 14
