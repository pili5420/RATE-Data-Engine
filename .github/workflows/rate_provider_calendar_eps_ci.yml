name: RATE Provider Calendar EPS Contract (synthetic only)
on:
  pull_request:
    branches: [main]
    paths:
      - src/provider_calendar_eps_contract.py
      - scripts/validate_provider_calendar_eps.py
      - scripts/verify_provider_calendar_eps.py
      - tests/test_provider_calendar_eps_contract.py
      - docs/RATE_PROVIDER_CALENDAR_QUARTER_EPS_V1.md
      - docs/contracts/RATE_PROVIDER_CALENDAR_QUARTER_EPS_V1.json
      - .github/workflows/rate_provider_calendar_eps_ci.yml
permissions:
  contents: read
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head additive isolation and all regression gates
        run: >
          python -B scripts/verify_provider_calendar_eps.py
          --expected-base 30fd48d56ab935f1f2358b69257faad0f8ad5a0a
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --output-dir "${{ runner.temp }}/calendar-eps"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CALENDAR_EPS_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/calendar-eps/
          if-no-files-found: error
          retention-days: 14
