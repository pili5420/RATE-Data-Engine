name: RATE CER-080 Multi-Day Production Continuity Acceptance

on:
  workflow_dispatch:
    inputs:
      previous_trading_date:
        description: Completed Day N trading date
        required: false
        default: "2026-09-18"
      current_trading_date:
        description: Day N+1 legal trading date
        required: false
        default: "2026-09-21"
  push:
    branches:
      - rate-v2-6-1r2-staging
    paths:
      - .github/workflows/rate_cer080_multi_day_continuity_acceptance.yml
      - src/cer080_multi_day_continuity.py
      - scripts/run_cer080_multi_day_continuity_acceptance.py
      - tests/test_cer080_multi_day_continuity.py

permissions:
  contents: read
  actions: read

concurrency:
  group: rate-cer080-multi-day-continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  multi-day-continuity:
    runs-on: ubuntu-latest
    env:
      RATE_LIVE_E2E_ENABLED: PRODUCTION_MULTI_DAY_CONTINUITY_ACCEPTANCE
      RATE_CER080_PREVIOUS_TRADING_DATE: ${{ inputs.previous_trading_date || '2026-09-18' }}
      RATE_CER080_CURRENT_TRADING_DATE: ${{ inputs.current_trading_date || '2026-09-21' }}
      RATE_CER073_FINAL_SOURCE_BUNDLE_ARTIFACT_ID: "10919292036"
      RATE_CER078_PERSIST_RESULT_ARTIFACT_ID: "10927903239"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Resolve numeric Actions job ID
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="multi-day-continuity") | .id' | head -n 1)
          test -n "$job_id"
          echo "ACTIONS_JOB_ID=$job_id" >> "$GITHUB_ENV"
      - name: Initialize fail-closed CER-080 artifacts
        shell: bash
        run: python scripts/run_cer080_multi_day_continuity_acceptance.py --source-bundle /tmp/missing.json --cer078-persisted-evidence /tmp/missing.json --output-dir artifacts/cer080 --state-root data/production/cer080_multi_day_continuity_acceptance --reset-state-root || true
      - name: Download accepted CER-073 and CER-078 evidence
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p artifacts/accepted/cer073 artifacts/accepted/cer078
          gh api "repos/${{ github.repository }}/actions/artifacts/${RATE_CER073_FINAL_SOURCE_BUNDLE_ARTIFACT_ID}/zip" > artifacts/accepted/cer073/source_bundle.zip
          unzip -o artifacts/accepted/cer073/source_bundle.zip -d artifacts/accepted/cer073/source_bundle
          gh api "repos/${{ github.repository }}/actions/artifacts/${RATE_CER078_PERSIST_RESULT_ARTIFACT_ID}/zip" > artifacts/accepted/cer078/persist_result.zip
          unzip -o artifacts/accepted/cer078/persist_result.zip -d artifacts/accepted/cer078/persist_result
      - name: Run focused CER-080 tests
        run: python -m unittest tests.test_cer080_multi_day_continuity -v
      - name: Verify main remains untouched before multi-day acceptance
        shell: bash
        run: |
          main_head=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "main_head=$main_head"
          test "$main_head" = "beae3ed542888cc647d64bbcecab7d907a7744aa"
      - name: Verify no prior CER production code changed by CER-080 commit
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            changed=$(git diff --name-only HEAD^ HEAD -- .github/workflows/rate_production_0730_scheduler.yml src/cer075_scheduler.py src/cer076_incremental_0930.py src/cer077_incremental_1200.py src/cer078_evening_1930.py src/cer079_full_day_chain.py scripts/run_cer075_scheduler_acceptance.py scripts/run_cer076_incremental_0930_acceptance.py scripts/run_cer077_incremental_1200_acceptance.py scripts/run_cer078_evening_1930_acceptance.py scripts/run_cer079_full_day_chain_acceptance.py tests/test_cer075_scheduler.py tests/test_cer076_incremental_0930.py tests/test_cer077_incremental_1200.py tests/test_cer078_evening_1930.py tests/test_cer079_full_day_chain.py .github/workflows/rate_cer076_0930_incremental_acceptance.yml .github/workflows/rate_cer077_1200_incremental_acceptance.yml .github/workflows/rate_cer078_1930_evening_acceptance.yml .github/workflows/rate_cer079_full_day_chain_acceptance.yml)
            test -z "$changed"
          fi
      - name: Execute multi-day continuity acceptance
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: >
          python scripts/run_cer080_multi_day_continuity_acceptance.py
          --source-bundle artifacts/accepted/cer073/source_bundle/RATE_CER073_FINAL_SOURCE_BUNDLE.json
          --cer078-persisted-evidence artifacts/accepted/cer078/persist_result/RATE_CER078_PERSIST_RESULT_EVIDENCE.json
          --output-dir artifacts/cer080
          --state-root data/production/cer080_multi_day_continuity_acceptance
          --reset-state-root
          --actions-job-id "$ACTIONS_JOB_ID"
      - name: Verify production namespace and no next CER activation
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          allowed_prefix='data/production/cer080_multi_day_continuity_acceptance/'
          changed=subprocess.run(['git','status','--porcelain','--untracked-files=all','--','data/production'],capture_output=True,text=True,check=True).stdout.splitlines()
          bad=[line for line in changed if allowed_prefix not in line.replace('\\','/')]
          if bad:
              raise SystemExit('PRODUCTION_NAMESPACE_GUARD:'+repr(bad))
          print(json.dumps({'production_namespace_guard':'PASS','unattended_multi_day_soak_test':'NO','next_cer_created':'NO'}))
          PY
      - name: Verify main remains untouched after multi-day acceptance
        if: always()
        shell: bash
        run: |
          main_head=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          echo "main_head=$main_head"
          test "$main_head" = "beae3ed542888cc647d64bbcecab7d907a7744aa"
      - name: Upload RATE_CER080_NEXT_TRADING_DAY_RESOLUTION_EVIDENCE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_CER080_NEXT_TRADING_DAY_RESOLUTION_EVIDENCE
          path: artifacts/cer080/RATE_CER080_NEXT_TRADING_DAY_RESOLUTION_EVIDENCE.json
          if-no-files-found: error
      - name: Upload RATE_CER080_CROSS_DAY_PREVIOUS_STATE_BINDING_EVIDENCE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_CER080_CROSS_DAY_PREVIOUS_STATE_BINDING_EVIDENCE
          path: artifacts/cer080/RATE_CER080_CROSS_DAY_PREVIOUS_STATE_BINDING_EVIDENCE.json
          if-no-files-found: error
      - name: Upload RATE_CER080_PERSISTENT_STATE_CARRY_FORWARD_EVIDENCE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_CER080_PERSISTENT_STATE_CARRY_FORWARD_EVIDENCE
