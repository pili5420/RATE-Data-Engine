name: RATE Fundamental First Refresh Execution Wiring
on:
  pull_request:
    branches: [main]
    paths:
      - src/fundamental_first_refresh_execution.py
      - scripts/run_fundamental_first_refresh_execution.py
      - scripts/verify_fundamental_first_refresh_execution.py
      - tests/test_fundamental_first_refresh_execution.py
      - docs/contracts/RATE_FUNDAMENTAL_FIRST_REFRESH_EXECUTION_V1.json
      - docs/RATE_FUNDAMENTAL_FIRST_REFRESH_EXECUTION_V1.md
      - .github/workflows/rate_fundamental_first_refresh_execution_ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head inherited plus J2-E tests
        run: >
          python -B scripts/verify_fundamental_first_refresh_execution.py
          --expected-base 29f1781e3c460ccf9a816c5b9774b00374cedfe1
          --expected-head "\${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "\${{ runner.temp }}/fundamental-first-refresh-wiring"
      - name: Current-main replacement gate
        run: >
          python -B scripts/verify_ci_applicability.py
          --expected-base 29f1781e3c460ccf9a816c5b9774b00374cedfe1
          --expected-head "\${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "\${{ runner.temp }}/fundamental-first-refresh-replacement"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FUNDAMENTAL_FIRST_REFRESH_WIRING_\${{ matrix.os }}_\${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            \${{ runner.temp }}/fundamental-first-refresh-wiring
            \${{ runner.temp }}/fundamental-first-refresh-replacement
          if-no-files-found: error
          retention-days: 14
