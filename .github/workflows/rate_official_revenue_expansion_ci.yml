name: RATE Official Revenue Expansion V1 Engineering
on:
  pull_request:
    branches: [main]
    paths:
      - "src/provider_revenue_snapshot.py"
      - "src/provider_financial_feature_inputs.py"
      - "scripts/expand_official_revenue.py"
      - "scripts/verify_official_revenue_expansion.py"
      - "tests/test_provider_revenue_snapshot.py"
      - "docs/RATE_OFFICIAL_REVENUE_EXPANSION_V1.md"
      - ".github/workflows/rate_official_revenue_expansion_ci.yml"
      - ".github/workflows/rate_provider_financial_features_ci.yml"
permissions:
  contents: read
jobs:
  synthetic-revenue-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing offline parser dependency
        run: python -m pip install lxml==6.1.1
      - name: Exact-head synthetic regression and opt-in isolation
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: >-
          python -B scripts/verify_official_revenue_expansion.py
          --expected-base "$EXPECTED_BASE" --expected-head "$EXPECTED_HEAD"
          --output-dir "$RUNNER_TEMP/official-revenue-engineering"
      - name: Clean worktree
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OFFICIAL_REVENUE_SYNTHETIC_NOT_REAL_${{ matrix.os }}_${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/official-revenue-engineering/
          if-no-files-found: error
          retention-days: 14
