name: RATE G01 R5 Offline Semantic CI

on:
  pull_request:
    paths:
      - 'tools/g01/**'
      - '.github/workflows/rate_g01_r5_offline_ci.yml'
  push:
    paths:
      - 'tools/g01/**'
      - '.github/workflows/rate_g01_r5_offline_ci.yml'

permissions:
  contents: read

jobs:
  offline-semantic:
    name: G01 R5 offline semantic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Run synthetic and actual-source offline tests
        run: python -B -m unittest discover -s tools/g01 -p 'test_r5_oracle.py' -v
