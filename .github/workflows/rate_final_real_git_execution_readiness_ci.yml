name: RATE Final Real Git Transaction Execution Readiness
on:
  pull_request:
    branches: [main]
    paths:
      - src/intraday_final_real_git_execution_readiness.py
      - tests/test_intraday_final_real_git_execution_readiness.py
      - docs/contracts/RATE_FINAL_REAL_GIT_TRANSACTION_EXECUTION_READINESS_V1.json
      - docs/RATE_FINAL_REAL_GIT_TRANSACTION_EXECUTION_READINESS_V1.md
      - .github/workflows/rate_final_real_git_execution_readiness_ci.yml
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -B -m unittest tests.test_intraday_final_real_git_execution_readiness -v
      - run: git diff --exit-code
