name: RATE Cloudflare Real Qualification Evidence Review

on:
  pull_request:
    branches: [main]
    paths:
      - src/intraday_cloudflare_d1_real_qualification_evidence_review.py
      - tests/test_intraday_cloudflare_d1_real_qualification_evidence_review.py
      - docs/contracts/RATE_CLOUDFLARE_D1_REAL_QUALIFICATION_EVIDENCE_REVIEW_V1.json
      - docs/RATE_CLOUDFLARE_D1_REAL_QUALIFICATION_EVIDENCE_REVIEW_V1.md
      - .github/workflows/rate_cloudflare_real_qualification_evidence_review_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Real qualification evidence review regressions
        run: python -B -m unittest tests.test_intraday_cloudflare_d1_real_qualification_evidence_review -v
      - name: No tracked mutation
        run: git diff --exit-code
