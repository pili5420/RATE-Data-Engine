name: RATE Fundamental Ranking Consumer Binding
on:
  pull_request:
    branches: [main]
    paths:
      - src/fundamental_ranking_consumer.py
      - scripts/run_fundamental_ranking_consumer.py
      - scripts/verify_fundamental_ranking_consumer.py
      - tests/test_fundamental_ranking_consumer.py
      - docs/contracts/RATE_FUNDAMENTAL_RANKING_CONSUMER_V1.json
      - docs/RATE_FUNDAMENTAL_RANKING_CONSUMER_V1.md
      - .github/workflows/rate_fundamental_ranking_consumer_ci.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rate-fundamental-consumer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head inherited and consumer synthetic tests
        run: >
          python -B scripts/verify_fundamental_ranking_consumer.py
          --expected-base e5953fa3ff7123a28d85ec6c4f361c25da9bc4ab
          --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "${{ runner.temp }}/fundamental-consumer"
      - name: Current-main replacement compatibility gate
        run: >
          python -B scripts/verify_ci_applicability.py
          --expected-base e5953fa3ff7123a28d85ec6c4f361c25da9bc4ab
          --expected-head "${{ github.event.pull_request.head.sha || github.sha }}"
          --output-dir "${{ runner.temp }}/fundamental-consumer-replacement"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FUNDAMENTAL_CONSUMER_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/fundamental-consumer
            ${{ runner.temp }}/fundamental-consumer-replacement
          if-no-files-found: error
          retention-days: 14
