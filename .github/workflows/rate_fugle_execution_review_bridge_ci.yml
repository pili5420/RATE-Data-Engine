name: RATE Fugle Execution Review Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - src/intraday_fugle_execution_review_bridge.py
      - tests/test_intraday_fugle_execution_review_bridge.py
      - docs/contracts/RATE_FUGLE_EXECUTION_REVIEW_BRIDGE_V1.json
      - docs/RATE_FUGLE_EXECUTION_REVIEW_BRIDGE_V1.md
      - .github/workflows/rate_fugle_execution_review_bridge_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bridge tests
        run: python -B -m unittest tests.test_intraday_fugle_execution_review_bridge -v
      - name: Existing review package regression
        run: python -B -m unittest tests.test_intraday_live_review_package tests.test_intraday_live_qualification_review -v
      - name: No tracked mutation
        run: git diff --exit-code
