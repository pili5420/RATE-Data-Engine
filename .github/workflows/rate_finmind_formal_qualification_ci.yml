name: RATE FinMind Formal Qualification (synthetic only)
on:
  pull_request:
    branches: [main]
    paths:
      - src/finmind_formal_qualification.py
      - scripts/qualify_finmind_eps.py
      - scripts/verify_finmind_formal_qualification.py
      - tests/test_finmind_formal_qualification.py
      - docs/RATE_FINMIND_FORMAL_EPS_QUALIFICATION.md
      - docs/contracts/RATE_FINMIND_FORMAL_EPS_QUALIFICATION_V1.json
      - .github/workflows/rate_finmind_formal_qualification_ci.yml
permissions:
  contents: read
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head protected regression and qualification gates
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >
          python -B scripts/verify_finmind_formal_qualification.py
          --expected-base 6ea91f2328827d2233537292a55fe6acf15b8470
          --expected-head "${{ env.EXPECTED_HEAD }}"
          --output-dir "${{ runner.temp }}/finmind-qualification"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FINMIND_QUALIFICATION_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/finmind-qualification/
          if-no-files-found: error
          retention-days: 14
