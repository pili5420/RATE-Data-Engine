name: RATE Exchange Authority Private Evidence Utility

on:
  pull_request:
    branches: [main]
    paths:
      - src/intraday_exchange_authority_private_evidence.py
      - scripts/build_exchange_authority_private_evidence_manifest.py
      - tests/test_intraday_exchange_authority_private_evidence.py
      - docs/contracts/RATE_INTRADAY_EXCHANGE_AUTHORITY_PRIVATE_EVIDENCE_MANIFEST_V1.json
      - docs/RATE_INTRADAY_EXCHANGE_AUTHORITY_PRIVATE_EVIDENCE_V1.md
      - .github/workflows/rate_exchange_authority_private_evidence_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Private evidence utility tests
        run: python -B -m unittest tests.test_intraday_exchange_authority_private_evidence -v
      - name: Exchange intake regression
        run: python -B -m unittest tests.test_intraday_exchange_authority_evidence_intake tests.test_intraday_provider_authority -v
      - name: No tracked mutation
        run: git diff --exit-code
