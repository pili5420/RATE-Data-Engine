name: RATE Cloudflare Post-Marker Qualification Orchestrator

on:
  pull_request:
    branches: [main]
    paths:
      - src/intraday_cloudflare_post_marker_orchestrator.py
      - tests/test_intraday_cloudflare_post_marker_orchestrator.py
      - docs/contracts/RATE_CLOUDFLARE_POST_MARKER_QUALIFICATION_ORCHESTRATION_V1.json
      - docs/RATE_CLOUDFLARE_POST_MARKER_QUALIFICATION_ORCHESTRATION_V1.md
      - .github/workflows/rate_cloudflare_post_marker_orchestrator_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post-marker orchestration regressions
        run: python -B -m unittest tests.test_intraday_cloudflare_post_marker_orchestrator -v
      - name: No tracked mutation
        run: git diff --exit-code
