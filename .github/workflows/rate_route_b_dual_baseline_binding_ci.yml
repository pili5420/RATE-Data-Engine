name: RATE Route B Dual Baseline Binding CI

on:
  pull_request:
    branches: [main]
    paths:
      - config/RATE_ROUTE_B_ACTIVATION_BASELINE_V1.json
      - src/route_b_git_ancestry.py
      - scripts/build_route_b_git_ancestry_evidence.py
      - src/route_b_post_merge_activation.py
      - src/route_b_activation_package.py
      - src/production_acceptance_session.py
      - src/route_b_acceptance_bridge.py
      - src/route_b_acceptance_store.py
      - src/route_b_acceptance_collector.py
      - src/current_production_final_acceptance.py
      - tests/test_route_b_git_ancestry.py
      - tests/test_route_b_post_merge_activation.py
      - tests/test_route_b_activation_package.py
      - tests/test_production_acceptance_session.py
      - tests/test_route_b_acceptance_bridge.py
      - tests/test_route_b_acceptance_store.py
      - tests/test_route_b_acceptance_collector.py
      - tests/test_current_production_final_acceptance.py
      - .github/workflows/rate_route_b_dual_baseline_binding_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dual baseline chain regression
        run: >-
          python -B -m unittest
          tests.test_route_b_git_ancestry
          tests.test_route_b_post_merge_activation
          tests.test_route_b_activation_package
          tests.test_production_acceptance_session
          tests.test_route_b_acceptance_bridge
          tests.test_route_b_acceptance_store
          tests.test_route_b_acceptance_collector
          tests.test_current_production_final_acceptance
          -v
      - name: No tracked mutation
        run: git diff --exit-code
