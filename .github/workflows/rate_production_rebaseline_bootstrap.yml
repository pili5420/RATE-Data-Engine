      - name: Upload rebaseline bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PRODUCTION_REBASELINE_BOOTSTRAP_${{ inputs.trading_date }}_${{ github.run_id }}
          path: |
            artifacts/production_state/RATE_PRODUCTION_REBASELINE_BOOTSTRAP_EVIDENCE.json
            artifacts/production_state/live/${{ inputs.trading_date }}/**/*.json
          if-no-files-found: warn
