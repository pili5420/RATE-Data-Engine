  "pushed_main_sha": None,
  "main_concurrency_status": "REBASELINE_BOOTSTRAP_PARENT_MISMATCH",
  "push_result": "BLOCKED",
  "execution_evidence_authority": "ACTIONS_ARTIFACT"
})
path.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
PY
              exit 1
            fi
            git commit -m "Bootstrap authorized RATE production rebaseline state"
            bootstrap_commit_sha="$(git rev-parse HEAD)"
            git fetch origin "${{ github.ref_name }}"
            origin_main_sha="$(git rev-parse "origin/${{ github.ref_name }}")"
            if [ "$origin_main_sha" != "$VALIDATED_MAIN_SHA" ]; then
              ORIGIN_MAIN_SHA="$origin_main_sha" BOOTSTRAP_PARENT_SHA="$bootstrap_parent_sha" BOOTSTRAP_COMMIT_SHA="$bootstrap_commit_sha" python - <<'PY'
