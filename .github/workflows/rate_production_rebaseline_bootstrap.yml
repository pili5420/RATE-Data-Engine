  "bootstrap_commit_sha": os.environ["BOOTSTRAP_COMMIT_SHA"],
  "pushed_main_sha": None,
  "main_concurrency_status": "MAIN_ADVANCED_AFTER_REBASELINE_VALIDATION",
  "push_result": "BLOCKED",
  "execution_evidence_authority": "ACTIONS_ARTIFACT"
})
path.write_text(json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
PY
              exit 1
            fi
            if git push origin "HEAD:${{ github.ref_name }}"; then
              ORIGIN_MAIN_SHA="$origin_main_sha" BOOTSTRAP_PARENT_SHA="$bootstrap_parent_sha" BOOTSTRAP_COMMIT_SHA="$bootstrap_commit_sha" python - <<'PY'
