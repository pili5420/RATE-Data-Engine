name: RATE Production 12:00 Recurring Scheduler

on:
  schedule:
    # GitHub cron is UTC. 04:00 UTC Monday-Friday = 12:00 Asia/Taipei Monday-Friday.
    - cron: "0 4 * * 1-5"
  workflow_dispatch:
    inputs:
      trading_date:
        description: Explicit legal Taiwan trading date YYYY-MM-DD for controlled recovery/testing
        required: true
  push:
    branches:
      - rate-v2-6-1r2-staging
    paths:
      - .github/workflows/rate_production_1200_scheduler.yml
      - scripts/resolve_production_runtime_context.py
      - scripts/publish_production_state_latest.py
      - src/production_live_state.py
      - tests/test_rate_soak_005.py
      - scripts/publish_production_source_bundle_latest.py
      - scripts/build_production_source_bundle_from_official.py
      - scripts/validate_production_scheduler_safety.py
      - tests/test_production_scheduler_change_control.py
      - src/cer077_incremental_1200.py
      - scripts/run_cer077_incremental_1200_acceptance.py
      - tests/test_cer077_incremental_1200.py

permissions:
  contents: write
  actions: read

concurrency:
  group: rate-production-0730-0930-1200-1930-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production-1200:
    runs-on: ubuntu-latest
    env:
      RATE_LIVE_E2E_ENABLED: PRODUCTION_SCHEDULER
      RATE_SOURCE_URL: "https://openapi.twse.com.tw/v1;https://www.tpex.org.tw/openapi/v1;https://www.tdcc.com.tw/portal/zh/smWeb/qryStock;https://mops.twse.com.tw/mops/web/ajax_t05st10_ifrs"
      RATE_PRODUCTION_CADENCE: "12:00"
      GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve numeric Actions job ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job_id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --jq '.jobs[] | select(.name=="production-1200") | .id' | head -n 1)
          test -n "$job_id"
          echo "ACTIONS_JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Resolve dynamic production runtime context
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p artifacts/production_1200 artifacts/production_runtime
          python scripts/resolve_production_runtime_context.py \
            --cadence "12:00" \
            --event-name "${{ github.event_name }}" \
            --dispatch-trading-date "${{ inputs.trading_date }}" \
            --state-root artifacts/production_state \
            --evidence-output artifacts/production_1200/RATE_PRODUCTION_RUNTIME_CONTEXT.json \
            --env-output "$RUNNER_TEMP/rate_runtime_context.env"
          cat "$RUNNER_TEMP/rate_runtime_context.env" >> "$GITHUB_ENV"

      - name: Validate production scheduler safety wiring
        run: python scripts/validate_production_scheduler_safety.py --output artifacts/production_1200/RATE_PRODUCTION_SCHEDULER_SAFETY_VALIDATION.json

      - name: Run cadence-focused guard tests
        run: python -m unittest tests.test_production_scheduler_change_control tests.test_rate_soak_005 -v

      - name: Build official production source bundle
        if: ${{ github.event_name != 'push' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        run: >
          python scripts/build_production_source_bundle_from_official.py
          --public-official-partial
          --trading-date "${{ env.RATE_PRODUCTION_TRADING_DATE }}"
          --cadence "${{ env.RATE_PRODUCTION_CADENCE }}"
          --rate-source-url "$RATE_SOURCE_URL"
          --output artifacts/production_1200/RATE_PRODUCTION_SOURCE_BUNDLE.json
          --evidence-output artifacts/production_1200/RATE_PRODUCTION_OFFICIAL_SOURCE_INGESTION_EVIDENCE.json

      - name: Execute production-safe 12:00 runtime path
        if: ${{ github.event_name != 'push' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: >
          python scripts/run_cer077_incremental_1200_acceptance.py
          --public-official-partial
          --source-bundle artifacts/production_1200/RATE_PRODUCTION_SOURCE_BUNDLE.json
          --cer074-persisted-evidence "$RATE_PREVIOUS_STATE_EVIDENCE_PATH" --cer075-persisted-evidence "$RATE_PREVIOUS_STATE_EVIDENCE_PATH" --cer076-persisted-evidence "$RATE_PREVIOUS_STATE_EVIDENCE_PATH"
          --output-dir artifacts/production_1200
          --state-root data/production/scheduler_1200
          --actions-job-id "$ACTIONS_JOB_ID"

      - name: Archive public report-consumption evidence before state readiness
        if: ${{ success() && github.event_name == 'schedule' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        run: >
          python scripts/publish_production_source_bundle_latest.py
          --public-official-partial
          --source-bundle artifacts/production_1200/RATE_PRODUCTION_SOURCE_BUNDLE.json
          --trading-date "${{ env.RATE_PRODUCTION_TRADING_DATE }}"
          --cadence "12:00"
          --artifacts-root artifacts
          --workflow-run-id "${{ github.run_id }}"
          --workflow-job-id "$ACTIONS_JOB_ID"
          --evidence-output artifacts/production_1200/RATE_PRODUCTION_SOURCE_BUNDLE_LATEST_UPDATE_EVIDENCE.json

      - name: Publish live production state pointer after source replay
        if: ${{ success() && github.event_name == 'schedule' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: >
          python scripts/publish_production_state_latest.py
          --persist-evidence artifacts/production_1200/RATE_CER077_PERSIST_RESULT_EVIDENCE.json
          --trading-date "${{ env.RATE_PRODUCTION_TRADING_DATE }}"
          --cadence "12:00"
          --artifacts-root artifacts
          --state-root data/production/scheduler_1200
          --workflow-run-id "${{ github.run_id }}"
          --workflow-job-id "$ACTIONS_JOB_ID"
          --evidence-output artifacts/production_1200/RATE_PRODUCTION_STATE_LIVE_UPDATE_EVIDENCE.json

      - name: Commit authorized production pointers
        if: ${{ success() && github.event_name == 'schedule' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/RATE_PRODUCTION_SOURCE_BUNDLE_LATEST.json artifacts/production_source_snapshots artifacts/RATE_PRODUCTION_STATE_LATEST.json artifacts/production_state/live
          if git diff --cached --quiet; then
            echo "authorized_pointer_commit=NO_CHANGES"
          else
            git commit -m "Update RATE production pointers (12:00)"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload committed live production state
        if: ${{ success() && github.event_name == 'schedule' && env.RATE_PRODUCTION_RUNTIME_MODE == 'RUN' }}
        uses: actions/upload-artifact@v4
        with:
          name: RATE_LIVE_PRODUCTION_STATE_1200_${{ env.RATE_PRODUCTION_TRADING_DATE }}_${{ github.run_id }}
          path: artifacts/production_state/live/${{ env.RATE_PRODUCTION_TRADING_DATE }}/1200/**
          if-no-files-found: error

      - name: Upload production cadence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PRODUCTION_1200_SCHEDULER_ARTIFACTS
          path: artifacts/production_1200/**
          if-no-files-found: warn

