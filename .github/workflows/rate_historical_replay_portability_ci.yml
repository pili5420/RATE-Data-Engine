name: Historical replay portability synthetic CI
on:
  pull_request:
    paths:
      - src/historical_replay_portability.py
      - scripts/run_historical_replay_portability.py
      - scripts/verify_historical_replay_portability.py
      - tests/test_historical_replay_portability.py
      - docs/contracts/RATE_HISTORICAL_REPLAY_PORTABILITY_V1.json
      - docs/RATE_HISTORICAL_REPLAY_PORTABILITY_V1.md
      - .github/workflows/rate_historical_replay_portability_ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head inherited and portability tests
        run: python -B scripts/verify_historical_replay_portability.py --expected-base dbd0983caf883fa9a39eb187fb3d01f192ecd61e --expected-head ${{ github.event.pull_request.head.sha || github.sha }} --output-dir "${{ runner.temp }}/replay-portability-proof"
      - name: Current-main replacement gate
        run: python -B scripts/verify_ci_applicability.py --expected-base dbd0983caf883fa9a39eb187fb3d01f192ecd61e --expected-head ${{ github.event.pull_request.head.sha || github.sha }} --output-dir "${{ runner.temp }}/replay-portability-replacement"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REPLAY_PORTABILITY_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/replay-portability-proof
            ${{ runner.temp }}/replay-portability-replacement
