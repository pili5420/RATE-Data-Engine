name: RATE TAIEX Network Probe
on:
  workflow_dispatch:
jobs:
  taiex-network-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official TAIEX JSON endpoints
        run: python scripts/probe_taiex_network.py
      - name: Upload transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAIEX_NETWORK_PROBE_EVIDENCE
          path: artifacts/TAIEX_NETWORK_PROBE_EVIDENCE.json
