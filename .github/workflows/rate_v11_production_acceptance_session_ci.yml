name: RATE V11 Production Acceptance Session

on:
  pull_request:
    branches: [main]
    paths:
      - src/production_acceptance_session.py
      - tests/test_production_acceptance_session.py
      - docs/contracts/RATE_V11_PRODUCTION_ACCEPTANCE_SESSION_V1.json
      - docs/RATE_V11_PRODUCTION_ACCEPTANCE_SESSION_V1.md
      - .github/workflows/rate_v11_production_acceptance_session_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Production Acceptance session tests
        run: python -B -m unittest tests.test_production_acceptance_session -v
      - name: Existing CER-081 final gate regression
        run: python -B -m unittest tests.test_intraday_cer081_final_production_acceptance -v
      - name: No tracked mutation
        run: git diff --exit-code
