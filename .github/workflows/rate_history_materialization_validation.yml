name: RATE History Materialization Validation

on:
  pull_request:
    paths:
      - "scripts/materialize_production_history_store.py"
      - ".github/workflows/rate_production_source_acquisition.yml"
      - "tests/test_rate_production_history_materialization.py"
      - ".github/workflows/rate_history_materialization_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bounded history materialization
        run: python -m py_compile scripts/materialize_production_history_store.py tests/test_rate_production_history_materialization.py
      - name: Smoke test production materializer module entrypoint
        run: python -m scripts.materialize_production_history_store --help
      - name: Run bounded history and production-source regression
        env:
          RATE_DETERMINISTIC_TEST: "1"
        run: >-
          python -m unittest
          tests.test_rate_production_history_materialization
          tests.test_historical_store
          tests.test_rate_production_source_acquisition
          tests.test_production_scheduler_change_control
          tests.test_cer057_tpex
          -v
