name: RATE Phase 2 Full-Market Rotation Review

on:
  pull_request:
    branches: [main]
    paths:
      - "config/RATE_FULL_MARKET_ROTATION_CONTRACT_V1.json"
      - "src/full_market_rotation.py"
      - "src/full_market_catalogue.py"
      - "src/full_market_materialization.py"
      - "src/phase2_production.py"
      - "config/RATE_PHASE2_CHANGE_REQUEST_V1.json"
      - "scripts/*phase2*.py"
      - "scripts/*production*.py"
      - "tests/test_phase2_production.py"
      - "tests/test_full_market_materialization.py"
      - ".github/workflows/rate_production_*_scheduler.yml"
      - "scripts/run_full_market_rotation.py"
      - "tests/test_full_market_rotation.py"
      - "docs/RATE_PHASE2_FULL_MARKET_ROTATION.md"
      - ".github/workflows/rate_phase2_full_market_rotation_ci.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Read-only full-market candidate and canonical continuity regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      RATE_PHASE2_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser for frozen contract tests
        run: python -m pip install PyYAML==6.0.3
      - name: Validate review workflow without executing production
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          -shellcheck= -pyflakes=
          .github/workflows/rate_phase2_full_market_rotation_ci.yml
          .github/workflows/rate_production_0730_scheduler.yml
          .github/workflows/rate_production_0930_scheduler.yml
          .github/workflows/rate_production_1200_scheduler.yml
          .github/workflows/rate_production_1930_scheduler.yml
      - name: Run isolated candidate and frozen-owner regression
        run: >-
          python -B -m unittest
          tests.test_full_market_rotation
          tests.test_phase2_production
          tests.test_full_market_materialization
          tests.test_logic
          tests.test_spec_formulas
          tests.test_technical_features
          tests.test_institutional_rotation_features
          tests.test_fundamental
          tests.test_stage_history
          tests.test_stage_evidence
          tests.test_rotation_history
          tests.test_source_bundle
          tests.test_thin_work_manifest
          tests.test_production_integration
          tests.test_state_engine
          tests.test_production_scheduler_change_control
          tests.test_rate_production_source_acquisition
          tests.test_production_source_latest_publisher
          tests.test_rate_rebaseline_bootstrap
          tests.test_rate_soak_005
          tests.test_rate_production_history_materialization
          tests.test_tpex_transport
          tests.test_tpex_date_binding -v
      - name: Confirm no tracked production mutation
        run: git diff --exit-code
