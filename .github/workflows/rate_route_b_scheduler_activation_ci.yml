name: RATE Route B Scheduler Activation
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rate_production_0930_scheduler.yml
      - .github/workflows/rate_production_1200_scheduler.yml
      - scripts/run_route_b_checkpoint.py
      - scripts/publish_production_state_latest.py
      - src/route_b_official_checkpoint.py
      - config/RATE_EXTERNAL_PRODUCTION_DEPENDENCIES.json
      - config/SOURCE_REGISTRY.json
      - config/RATE_PRODUCTION_OFFICIAL_SOURCE_REGISTRY_V1.json
      - tests/test_production_scheduler_change_control.py
      - tests/test_route_b_scheduler_activation.py
      - .github/workflows/rate_route_b_scheduler_activation_ci.yml
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cross-platform timezone data
        run: python -m pip install tzdata==2025.2
      - name: Route B scheduler activation tests
        run: python -B -m unittest tests.test_route_b_scheduler_activation tests.test_route_b_official_checkpoint tests.test_route_b_zero_fee_contract -v
      - name: Existing scheduler change-control regression
        run: python -B -m unittest tests.test_production_scheduler_change_control -v
      - name: Scheduler safety validation
        run: python -B scripts/validate_production_scheduler_safety.py --output artifacts/route_b_scheduler_safety.json
      - name: No tracked mutation
        run: git diff --exit-code
