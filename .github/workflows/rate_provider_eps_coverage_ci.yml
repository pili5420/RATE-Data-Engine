name: RATE Provider EPS Coverage Engineering Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/provider_eps_candidate.py"
      - "src/provider_eps_coverage.py"
      - "scripts/*provider_eps_coverage.py"
      - "scripts/verify_provider_eps_candidate.py"
      - "tests/test_provider_eps_coverage.py"
      - "docs/RATE_PROVIDER_EPS_COVERAGE.md"
      - ".github/workflows/rate_provider_eps_coverage_ci.yml"

permissions:
  contents: read

jobs:
  engineering-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing catalogue/revenue parser dependencies
        run: python -m pip install lxml==6.1.1
      - name: Exact base/head offline engineering coverage and regression
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          python -B scripts/verify_provider_eps_coverage.py
          --expected-base "$EXPECTED_BASE" --expected-head "$EXPECTED_HEAD"
          --output-dir "$RUNNER_TEMP/provider-coverage-engineering-evidence"
      - name: Clean worktree
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain explicitly synthetic coverage evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PROVIDER_COVERAGE_ENGINEERING_NOT_REAL_${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/provider-coverage-engineering-evidence/
          if-no-files-found: error
          retention-days: 14
