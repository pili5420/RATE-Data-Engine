name: RATE Phase A2 Production Integration
on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: "Completed trading date YYYY-MM-DD"
        required: true
        default: "2025-09-12"
jobs:
  phase-a2:
    runs-on: ubuntu-latest
    env:
      TDCC_OPENAPI_BASE: https://openapi.tdcc.com.tw
      RATE_TWSE_SYMBOLS: ""
      RATE_UNIVERSE_FILE: config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve approved staging universe
        run: >
          python scripts/resolve_staging_universe.py
          --approval config/staging/RATE_STAGING_UNIVERSE_APPROVAL_V1.json
          --output config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
      - name: Probe TWSE historical redirect transport
        run: >
          python scripts/probe_twse_history_transport.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE.json
      - name: Probe official sources
        run: >
          python scripts/probe_official_sources.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE.json
          --universe-file config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
      - name: Build live production source bundle
        run: >
          python scripts/build_live_source_bundle.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/live_source_bundle.json
          --evidence-output artifacts/RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE.json
      - name: Run Phase A2 production integration
        run: >
          python scripts/run_phase_a2.py
          --trading-date "${{ inputs.trading_date }}"
          --source-bundle artifacts/live_source_bundle.json
      - name: Upload Phase A2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PHASE_A2_VALIDATION_EVIDENCE
          path: artifacts/RATE_PHASE_A2_VALIDATION_EVIDENCE.json
      - name: Upload LIVE source assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE
          path: artifacts/RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE.json
      - name: Upload official source probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE
          path: artifacts/RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE.json
      - name: Upload TWSE history transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE
          path: artifacts/RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE.json
