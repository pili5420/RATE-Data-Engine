name: RATE Phase A2 Production Integration
on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: "Completed trading date YYYY-MM-DD"
        required: true
        default: "2025-09-12"
jobs:
  phase-a2:
    runs-on: ubuntu-latest
    env:
      TDCC_OPENAPI_BASE: https://openapi.tdcc.com.tw
      RATE_TWSE_SYMBOLS: ""
      RATE_UNIVERSE_FILE: config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
      RATE_STAGING_REALTIME: "1"
      TWSE_HISTORY_MIN_INTERVAL_SECONDS: "1.5"
      RATE_TWSE_BOOTSTRAP_CHECKPOINT: data/staging/history_bootstrap/RATE_TWSE_HISTORY_BOOTSTRAP_CHECKPOINT_V1.json
      RATE_STAGING_HISTORY_STORE_ROOT: data/staging/history
      RATE_NORMALIZATION_SCHEMA_VERSION: RATE-STOCK-NORMALIZED-V1
      RATE_SOURCE_DATASET_VERSION: TWSE_STOCK_DAY_V1
      RATE_CHECKPOINT_SCHEMA_VERSION: RATE-TWSE-HISTORY-CHECKPOINT-V1
      MAX_NEW_PERIODS_PER_CHUNK: "12"
      MAX_CHUNK_RUNTIME_SECONDS: "600"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve approved staging universe
        run: >
          python scripts/resolve_staging_universe.py
          --approval config/staging/RATE_STAGING_UNIVERSE_APPROVAL_V1.json
          --output config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
      - name: Resolve bootstrap cache identity
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          p = 'config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json'
          obj = json.load(open(p, encoding='utf-8'))
          print('RATE_UNIVERSE_DIGEST=' + obj['universe_symbol_digest'])
          print('RATE_BOOTSTRAP_CACHE_PREFIX=rate-twse-bootstrap-v1-' + obj['universe_symbol_digest'] + '-RATE-STOCK-NORMALIZED-V1-TWSE_STOCK_DAY_V1-RATE-TWSE-HISTORY-CHECKPOINT-V1-')
          print('RATE_BOOTSTRAP_CACHE_KEY=rate-twse-bootstrap-v1-' + obj['universe_symbol_digest'] + '-RATE-STOCK-NORMALIZED-V1-TWSE_STOCK_DAY_V1-RATE-TWSE-HISTORY-CHECKPOINT-V1-${{ github.run_id }}-${{ github.run_attempt }}')
          PY
      - name: Restore newest compatible TWSE bootstrap checkpoint
        id: checkpoint_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            data/staging/history_bootstrap
            data/staging/history
          key: ${{ env.RATE_BOOTSTRAP_CACHE_KEY }}
          restore-keys: ${{ env.RATE_BOOTSTRAP_CACHE_PREFIX }}
      - name: Bootstrap bounded TWSE historical state
        id: bootstrap
        run: >
          python scripts/bootstrap_live_history.py
          --trading-date "${{ inputs.trading_date }}"
          --universe-file config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
          --checkpoint "$RATE_TWSE_BOOTSTRAP_CHECKPOINT"
          --evidence-output artifacts/RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE.json
          --max-new-periods "$MAX_NEW_PERIODS_PER_CHUNK"
          --max-runtime-seconds "$MAX_CHUNK_RUNTIME_SECONDS"
          --chunk-sequence "${{ github.run_attempt }}"
      - name: Validate checkpoint before cache save
        id: checkpoint_validate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.build_live_source_bundle import validate_checkpoint
          out = Path(os.environ['GITHUB_OUTPUT'])
          try:
              result = validate_checkpoint(os.environ['RATE_TWSE_BOOTSTRAP_CHECKPOINT'], os.environ['RATE_UNIVERSE_DIGEST'])
              print('checkpoint_validation=PASS')
              with out.open('a', encoding='utf-8') as f: f.write('valid=true\n')
          except Exception as exc:
              print('checkpoint_validation=FAIL:' + str(exc))
              with out.open('a', encoding='utf-8') as f: f.write('valid=false\n')
      - name: Save TWSE bootstrap checkpoint generation
        if: always() && steps.checkpoint_validate.outputs.valid == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/staging/history_bootstrap
            data/staging/history
          key: ${{ env.RATE_BOOTSTRAP_CACHE_KEY }}
      - name: Gate full bundle on historical completion
        id: bootstrap_gate
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE.json ]; then
            status=$(python -c "import json; print(json.load(open('artifacts/RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE.json', encoding='utf-8')).get('status','FATAL_DATA_INTEGRITY_FAILURE'))")
          else
            status=FATAL_DATA_INTEGRITY_FAILURE
          fi
          echo "bootstrap_status=$status"
          if [ "$status" = "BOOTSTRAP_COMPLETE" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "complete=false" >> "$GITHUB_OUTPUT"; fi
      - name: Probe TWSE historical redirect transport
        if: steps.bootstrap_gate.outputs.complete == 'true'
        run: >
          python scripts/probe_twse_history_transport.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE.json
      - name: Probe official sources
        if: steps.bootstrap_gate.outputs.complete == 'true'
        run: >
          python scripts/probe_official_sources.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE.json
          --universe-file config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json
      - name: Build live production source bundle
        if: steps.bootstrap_gate.outputs.complete == 'true'
        run: >
          python scripts/build_live_source_bundle.py
          --trading-date "${{ inputs.trading_date }}"
          --output artifacts/live_source_bundle.json
          --evidence-output artifacts/RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE.json
          --bootstrap-evidence-output artifacts/RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE.json
      - name: Run Phase A2 production integration
        if: steps.bootstrap_gate.outputs.complete == 'true'
        run: >
          python scripts/run_phase_a2.py
          --trading-date "${{ inputs.trading_date }}"
          --source-bundle artifacts/live_source_bundle.json
      - name: Upload Phase A2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PHASE_A2_VALIDATION_EVIDENCE
          path: artifacts/RATE_PHASE_A2_VALIDATION_EVIDENCE.json
      - name: Upload LIVE source assembly evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE
          path: artifacts/RATE_LIVE_SOURCE_ASSEMBLY_EVIDENCE.json
      - name: Upload official source probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE
          path: artifacts/RATE_OFFICIAL_SOURCE_PROBE_EVIDENCE.json
      - name: Upload TWSE history transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE
          path: artifacts/RATE_TWSE_HISTORY_TRANSPORT_EVIDENCE.json
      - name: Upload TWSE bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE
          path: artifacts/RATE_TWSE_HISTORY_BOOTSTRAP_EVIDENCE.json
      - name: Upload TWSE bootstrap checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_TWSE_HISTORY_BOOTSTRAP_CHECKPOINT
          path: data/staging/history_bootstrap/RATE_TWSE_HISTORY_BOOTSTRAP_CHECKPOINT_V1.json
