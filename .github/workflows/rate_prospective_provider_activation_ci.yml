name: RATE Prospective Provider Activation (synthetic only)
on:
  pull_request:
    branches: [main, codex/prospective-fundamental-activation-v1]
    paths:
      - src/prospective_provider_activation.py
      - scripts/run_prospective_provider_activation.py
      - scripts/verify_prospective_provider_activation.py
      - tests/test_prospective_provider_activation.py
      - docs/contracts/RATE_PROSPECTIVE_PROVIDER_ACTIVATION_V1.json
      - docs/RATE_PROSPECTIVE_PROVIDER_ACTIVATION_V1.md
      - .github/workflows/rate_prospective_provider_activation_ci.yml
permissions:
  contents: read
jobs:
  exact-head:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: Exact-head unchanged gates and prospective activation evidence
        run: >
          python -B scripts/verify_prospective_provider_activation.py
          --expected-base feff6a487ed96e7c2c3535c95f3bd62a06ad5cb7
          --expected-head "${{ github.event.pull_request.head.sha }}"
          --output-dir "${{ runner.temp }}/activation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ACTIVATION_SYNTHETIC_${{ matrix.os }}_${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/activation/
          if-no-files-found: error
          retention-days: 14
