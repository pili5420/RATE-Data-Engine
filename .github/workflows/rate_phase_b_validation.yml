name: RATE Phase B Intraday Validation

on:
  workflow_dispatch:
    inputs:
      slots:
        description: "Comma-separated slots"
        required: false
        default: "0930,1200"

jobs:
  phase-b-validation:
    runs-on: ubuntu-latest
    env:
      RATE_SOURCE_API_KEY: ${{ secrets.RATE_SOURCE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Validate secret presence
        shell: bash
        run: |
          if [ -z "${RATE_SOURCE_API_KEY:-}" ]; then
            echo "RATE_SOURCE_API_KEY is unavailable"
            exit 1
          fi
          echo "RATE_SOURCE_API_KEY is available"
      - name: Phase B live smoke validation
        run: python scripts/validate_phase_b_intraday.py --provider fugle --smoke-test --live
      - name: Publish smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PHASE_B_SMOKE_TEST_EVIDENCE
          path: artifacts/RATE_PHASE_B_SMOKE_TEST_EVIDENCE.json
