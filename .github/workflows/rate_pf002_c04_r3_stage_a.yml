name: RATE PF002 C04-R3 authenticated Native Stage-A
run-name: PF002-C04-R3 ${{ inputs.role || 'offline' }}
on:
  push:
    branches: [codex/pf002-c04-r3-pf01-byte-exact-stage-a-v1]
    paths:
      - tools/pf002_c04_r3_native_stage_a/**
      - .github/workflows/rate_pf002_c04_r3_stage_a.yml
  workflow_dispatch:
    inputs:
      role:
        description: One fresh authorized Stage-A Normal case only
        required: true
        type: choice
        options: [qualification, reproduction]
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Inherited 108 offline regression; no native calls
        shell: pwsh
        run: python -I -B -S tools/pf_personal_collector/run_offline_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/inherited"
      - name: Five pure descriptor predicates; no CIM API
        shell: pwsh
        run: |
          $result = & ./tools/pf_personal_collector/test_descriptor_policy.ps1
          if (($result | ConvertFrom-Json).status -ne 'PASS') { throw 'PURE_DESCRIPTOR_FAILED' }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/C04-R3-offline/DESCRIPTOR_TEST_RESULT.json", $result + [char]10, [Text.UTF8Encoding]::new($false))
      - name: Inherited C01 57 offline regression
        shell: pwsh
        run: python -I -B -S tools/pf002_containment_c01/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/c01"
      - name: Inherited C02 46 offline regression
        shell: pwsh
        run: python -I -B -S tools/pf002_c02_job_member_provenance/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/c02"
      - name: Inherited C03 63 offline regression
        shell: pwsh
        run: python -I -B -S tools/pf002_c03_forensic_evidence/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/c03"
      - name: New canonical identity offline negative tests
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_image_identity/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/new"
      - name: New R1 contract regression
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r1_legacy_contract/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/r1"
      - name: R2 authentication and secret-boundary negative tests; no network
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r2_preauth_transport/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/r2"
      - name: R3 integration security regression; no native or network
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r3_native_stage_a/run_tests.py --output "$env:RUNNER_TEMP/C04-R3-offline/r3"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c04-r3-offline-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/C04-R3-offline
          if-no-files-found: error
          overwrite: false
  stage_a:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: windows-2022
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PF002_C04_R3_PROFILE: SIGNED_HOSTED_NATIVE_STAGE_A
      PF002_ROLE: ${{ inputs.role }}
      PF002_WORK_ORDER_SHA256: ccd6fd3dfa277f5880df4e21a810d4bbce6b1dd14efe016f971d67a73b9a3c5d
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Fresh authenticated five GETs then exactly one Stage-A Normal Root; no StageB
        shell: pwsh
        env:
          PF002_R3_API_TOKEN: ${{ github.token }}
        run: python -I -B -S tools/pf002_c04_r3_native_stage_a/entry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c04-r3-stage-a-${{ inputs.role }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PF002-C04-R3-${{ github.run_id }}-1-${{ inputs.role }}/public
          if-no-files-found: error
          overwrite: false
