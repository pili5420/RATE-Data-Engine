name: RATE V11 Design-only Exact-head CI Gate

# Design reviews use the protected base's workflow code, not PR-controlled workflow
# files. Candidate self-review on PR215 is engineering evidence ONLY.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  design-only:
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.pull_request.number == 213 || github.event.pull_request.number == 214)) ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 215)
    name: Design-only exact-head (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout untrusted target only for git diff and document bytes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact trusted base commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"
      - name: Install immutable trusted verifier from base only
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/trusted_gate/scripts" "$RUNNER_TEMP/trusted_gate/tests"
          git show "$BASE_SHA:scripts/verify_rate_design_only_ci.py" > "$RUNNER_TEMP/trusted_gate/scripts/verify_rate_design_only_ci.py"
          git show "$BASE_SHA:tests/test_rate_design_only_ci.py" > "$RUNNER_TEMP/trusted_gate/tests/test_rate_design_only_ci.py"
          test -s "$RUNNER_TEMP/trusted_gate/scripts/verify_rate_design_only_ci.py"
          test -s "$RUNNER_TEMP/trusted_gate/tests/test_rate_design_only_ci.py"
      - name: Test trusted verifier from base (never PR head)
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          cd "$RUNNER_TEMP/trusted_gate"
          python -B -m unittest discover -s tests -p test_rate_design_only_ci.py -v
      - name: Verify exact-head document with trusted base verifier
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -I -B "$RUNNER_TEMP/trusted_gate/scripts/verify_rate_design_only_ci.py" --pr-number "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: Offline tests of candidate verifier (NOT trusted design admission)
        if: github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest tests.test_rate_design_only_ci -v
      - name: Candidate self-review scope only (NOT trusted design admission)
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B scripts/verify_rate_design_only_ci.py --pr-number "$PR_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
      - name: No tracked file mutation
        shell: bash
        run: git diff --exit-code && git diff --cached --exit-code
