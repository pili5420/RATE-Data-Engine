name: RATE PF002 R3-CB01 offline audit and cleanup corrective
on:
  push:
    branches: [codex/pf002-c04-r3-cb01-audit-cleanup-v1]
    paths:
      - tools/pf002_c04_r3_native_stage_a/**
      - tools/pf002_c04_r3_cb01/**
      - .github/workflows/rate_pf002_c04_r3_cb01_offline.yml
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Inherited 108 offline tests
        shell: pwsh
        run: python -I -B -S tools/pf_personal_collector/run_offline_tests.py --output "$env:RUNNER_TEMP/CB01-offline/inherited"
      - name: Five pure descriptor tests; no CIM
        shell: pwsh
        run: |
          $result = & ./tools/pf_personal_collector/test_descriptor_policy.ps1
          if (($result | ConvertFrom-Json).status -ne 'PASS') { throw 'PURE_DESCRIPTOR_FAILED' }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP/CB01-offline/DESCRIPTOR_TEST_RESULT.json", $result + [char]10, [Text.UTF8Encoding]::new($false))
      - name: Inherited C01 57
        shell: pwsh
        run: python -I -B -S tools/pf002_containment_c01/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/c01"
      - name: Inherited C02 46
        shell: pwsh
        run: python -I -B -S tools/pf002_c02_job_member_provenance/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/c02"
      - name: Inherited C03 63
        shell: pwsh
        run: python -I -B -S tools/pf002_c03_forensic_evidence/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/c03"
      - name: Inherited C04 94
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_image_identity/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/c04"
      - name: Inherited R1 42
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r1_legacy_contract/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/r1"
      - name: Inherited R2 78
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r2_preauth_transport/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/r2"
      - name: Inherited R3 89; assertions unchanged
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r3_native_stage_a/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/r3"
      - name: New CB01 negative and RED GREEN control flow; no Native
        shell: pwsh
        run: python -I -B -S tools/pf002_c04_r3_cb01/run_tests.py --output "$env:RUNNER_TEMP/CB01-offline/cb01"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cb01-offline-${{ matrix.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/CB01-offline
          if-no-files-found: error
          overwrite: false
