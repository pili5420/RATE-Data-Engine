name: RATE Production Official Source Acquisition

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: Legal Taiwan trading date YYYY-MM-DD for source acquisition
        required: true
      cadence:
        description: Production cadence
        required: true
        type: choice
        options:
          - "07:30"
          - "09:30"
          - "12:00"
          - "19:30"
      universe_contract_path:
        description: Optional Control Center-approved production universe contract path committed on main
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  source-acquisition:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      RATE_SOURCE_URL: "TWSE=https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL;TPEX=https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes;TDCC=https://www.tdcc.com.tw/portal/zh/smWeb/qryStock;MOPS=https://mops.twse.com.tw/mops/web/ajax_t05st10_ifrs"
      SCHEDULED_SOAK_CREDIT: "false"
      ACCEPTANCE_COUNTER_RESET: "false"
      EXECUTION_SCOPE: "PRODUCTION_SOURCE_ACQUISITION"
      EXECUTION_AUTHORITY: "MAIN_ONLY"
      VALIDATED_MAIN_SHA: ${{ github.sha }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage formal source contract artifacts
        run: |
          mkdir -p artifacts/production_source_acquisition
          cp config/RATE_PRODUCTION_SOURCE_CADENCE_APPLICABILITY.json artifacts/production_source_acquisition/RATE_PRODUCTION_SOURCE_CADENCE_APPLICABILITY.json
          cp config/RATE_EXTERNAL_PRODUCTION_DEPENDENCIES.json artifacts/production_source_acquisition/RATE_EXTERNAL_PRODUCTION_DEPENDENCIES.json

      - name: Build official production source bundle only
        env:
          GITHUB_SHA: ${{ github.sha }}
          RATE_UNIVERSE_CONTRACT_PATH: ${{ inputs.universe_contract_path }}
        run: |
          args=(
            scripts/build_production_source_bundle_from_official.py
            --trading-date "${{ inputs.trading_date }}"
            --cadence "${{ inputs.cadence }}"
            --rate-source-url "$RATE_SOURCE_URL"
            --output artifacts/production_source_acquisition/RATE_PRODUCTION_SOURCE_BUNDLE.json
            --evidence-output artifacts/production_source_acquisition/RATE_PRODUCTION_OFFICIAL_SOURCE_ACQUISITION_EVIDENCE.json
            --requirement-matrix-output artifacts/production_source_acquisition/RATE_PRODUCTION_SOURCE_REQUIREMENT_MATRIX.json
            --universe-binding-output artifacts/production_source_acquisition/RATE_PRODUCTION_UNIVERSE_BINDING.json
            --freshness-matrix-output artifacts/production_source_acquisition/RATE_PRODUCTION_SOURCE_FRESHNESS_MATRIX.json
            --feature-input-contract-output artifacts/production_source_acquisition/RATE_PRODUCTION_FEATURE_INPUT_CONTRACT.json
          )
          if [ -n "$RATE_UNIVERSE_CONTRACT_PATH" ]; then
            args+=(--universe-contract "$RATE_UNIVERSE_CONTRACT_PATH")
          fi
          python "${args[@]}"

      - name: Upload source acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_PRODUCTION_SOURCE_ACQUISITION_${{ inputs.trading_date }}_${{ inputs.cadence }}_${{ github.run_id }}
          path: artifacts/production_source_acquisition/*.json
          if-no-files-found: error
