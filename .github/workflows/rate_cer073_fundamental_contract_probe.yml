name: RATE CER-073 Fundamental Contract Probe

on:
  workflow_dispatch:
  push:
    branches:
      - rate-v2-6-1r2-staging
    paths:
      - scripts/probe_fundamental_contracts.py

permissions:
  contents: read
  actions: read

jobs:
  fundamental-contract-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run CER-073 focused tests
        run: python -m unittest tests.test_cer073_fundamental_history_v2 tests.test_cer073_source_wiring

      - name: Universe preflight
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path("config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json")
          expected_digest = "30276287608b87f7d9b606891514247da523dce9214e4b82bb34ba118a35af4c"
          if not path.is_file():
              raise SystemExit("BLOCKED:STAGING_UNIVERSE_IDENTITY_MISMATCH:file_missing")
          obj = json.loads(path.read_text(encoding="utf-8"))
          checks = [
              obj.get("artifact") == "CONTROL_CENTER_APPROVED_STAGING_VALIDATION_UNIVERSE_V1",
              obj.get("validation_status") == "PASS",
              obj.get("record_count") == 30,
              obj.get("unique_count") == 30,
              obj.get("markets", {}).get("TWSE") == 25,
              obj.get("markets", {}).get("TPEX") == 5,
              obj.get("universe_symbol_digest") == expected_digest,
          ]
          if not all(checks):
              raise SystemExit("BLOCKED:STAGING_UNIVERSE_IDENTITY_MISMATCH")
          print("Universe Preflight = PASS")
          print("Universe Symbols = 30/30")
          print("TWSE = 25")
          print("TPEx = 5")

      - name: Probe official fundamental historical contracts
        run: python scripts/probe_fundamental_contracts.py --universe-file config/staging/RATE_STAGING_LIVE_UNIVERSE_V1.json

      - name: Upload revenue contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_CER073_REVENUE_CONTRACT_EVIDENCE
          path: artifacts/RATE_CER073_REVENUE_CONTRACT_EVIDENCE.json
          if-no-files-found: error

      - name: Upload EPS contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_CER073_EPS_CONTRACT_EVIDENCE
          path: artifacts/RATE_CER073_EPS_CONTRACT_EVIDENCE.json
          if-no-files-found: error
