name: RATE P0 Observability Corrective CI

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rate_p0_observability_corrective_ci.yml
      - .github/workflows/rate_production_*_scheduler.yml
      - scripts/build_phase2_production_source.py
      - scripts/build_scheduler_actual_timing_evidence.py
      - scripts/publish_production_state_latest.py
      - src/p0_source_diagnostics.py
      - src/full_market_catalogue.py
      - src/full_market_materialization.py
      - src/cer081_scheduler_actual_timing.py
      - tests/test_p0_observability.py
      - tests/test_full_market_history_catalogue_transport.py
      - tests/test_phase2_compatibility.py

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore exact Git bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          for file in \
            artifacts/production_state/live/2026-10-02/1930/*.json \
            config/RATE_FOUR_CADENCE_REPORT_SOAK_V1.json \
            src/report_production_soak.py \
            src/public_official_partial_valid.py \
            src/sources/fundamental_history.py \
            src/feature_math.py \
            src/rate_logic.py \
            src/cer081_unattended_soak.py; do
            git show "HEAD:$file" > "$file"
          done
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing YAML test dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Offline source, scheduler, and Phase 2 regression
        run: >-
          python -B -m unittest
          tests.test_p0_observability
          tests.test_full_market_history_catalogue_transport
          tests.test_phase2_production
          tests.test_cer081_scheduler_actual_timing
          tests.test_cer081_scheduler_lock_validation
          tests.test_phase2_compatibility
          -v
      - name: No tracked mutation
        run: git diff --exit-code
