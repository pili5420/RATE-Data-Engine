name: RATE PR90 Regression Closure

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_rate_soak_005.py
      - tests/report_soak_support.py
      - tests/test_full_market_rotation.py
      - .github/workflows/rate_pr90_regression_closure_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve exact Git blob bytes
        shell: bash
        run: |
          git config core.autocrlf false
          git checkout-index --all --force
          python - <<'PY'
          from pathlib import Path
          import subprocess
          frozen = [
              "src/rate_logic.py",
              "src/institutional_features.py",
              "src/stage_evidence.py",
              "src/technical_features.py",
              "src/rotation_history.py",
              "control_center/production_control/v1/04_GOLDEN_TEST_FIXTURES_V1.0.md",
              "control_center/production_control/v1/01_RATE_PRODUCTION_LOGIC_SPEC_V1.1.md",
          ]
          for name in frozen:
              Path(name).write_bytes(subprocess.check_output(["git","show",f"HEAD:{name}"]))
          PY
          git diff --exit-code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install lxml==6.1.1 tzdata==2025.2 PyYAML==6.0.3
      - name: PR90 regression closure
        run: >-
          python -B -m unittest
          tests.test_rate_soak_005
          tests.test_report_production_soak
          tests.test_full_market_rotation
          tests.test_production_scheduler_change_control -v
      - name: No tracked mutation
        run: git diff --exit-code
