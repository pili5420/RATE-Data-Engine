name: TWSE T86 Historical Retrieval Smoke Test
on:
  workflow_dispatch:
    inputs:
      request_date:
        description: "Completed trading date YYYY-MM-DD"
        required: true
        default: "2025-09-12"
jobs:
  t86-retrieval:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Historical T86 retrieval smoke test
        run: python scripts/validate_t86_retrieval.py --date "${{ inputs.request_date }}"
      - name: Upload retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RATE_T86_RETRIEVAL_SMOKE_TEST_EVIDENCE
          path: artifacts/RATE_T86_RETRIEVAL_SMOKE_TEST_EVIDENCE.json
