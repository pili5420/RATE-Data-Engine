name: RATE Authorized Intraday Payload Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - src/authorized_intraday_feed.py
      - tests/test_authorized_intraday_feed.py
      - docs/contracts/RATE_AUTHORIZED_TAIWAN_INTRADAY_PAYLOAD_V1.json
      - docs/RATE_AUTHORIZED_TAIWAN_INTRADAY_PAYLOAD_V1.md
      - .github/workflows/rate_authorized_intraday_payload_ci.yml

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing scheduler timezone dependency
        run: python -m pip install tzdata==2025.2
      - name: Provider-neutral qualification and scheduler regressions
        run: >-
          python -B -m unittest
          tests.test_authorized_intraday_feed
          tests.test_production_scheduler_change_control -v
      - name: No tracked mutation
        run: git diff --exit-code
